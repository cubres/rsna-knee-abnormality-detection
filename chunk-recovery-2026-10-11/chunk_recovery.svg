<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
<title id="title">Registered chunks conserve the training state</title>
<desc id="desc">An epoch retains all 434 groups while sessions stop at 100, 200, 300, 400 and 434. A checkpoint and commit marker precede exact continuation. CPU equality is measured; native qualification remains separate.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#335e7d"/></marker></defs>
<rect width="1440" height="800" rx="28" fill="#f3f7fb"/>
<text x="62" y="76" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#142f45">100 groups, then continue the same state</text>
<text x="64" y="112" font-family="Arial,sans-serif" font-size="19" fill="#526b7f">Original CPU witness · full epoch and absolute schedule remain intact</text>
<rect x="60" y="154" width="1320" height="178" rx="18" fill="white" stroke="#d1deea"/>
<text x="86" y="190" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#142f45">One epoch: 434 groups · 3,472 observed positions · the same 7 unused positions</text>
<g font-family="Arial,sans-serif" font-size="19" fill="#142f45" text-anchor="middle">
<rect x="88" y="216" width="272" height="60" rx="9" fill="#dcecf8"/><text x="224" y="252">0 → 100</text>
<rect x="374" y="216" width="272" height="60" rx="9" fill="#dcecf8"/><text x="510" y="252">100 → 200</text>
<rect x="660" y="216" width="272" height="60" rx="9" fill="#dcecf8"/><text x="796" y="252">200 → 300</text>
<rect x="946" y="216" width="272" height="60" rx="9" fill="#dcecf8"/><text x="1082" y="252">300 → 400</text>
<rect x="1232" y="216" width="120" height="60" rx="9" fill="#cae8db"/><text x="1292" y="252">→ 434</text>
</g>
<text x="88" y="306" font-family="Arial,sans-serif" font-size="17" fill="#526b7f">Workers follow the original 50-group recycle grid; epoch evaluation belongs only at completion.</text>
<g fill="white" stroke="#c6d9e8" stroke-width="2">
<rect x="60" y="374" width="220" height="98" rx="16"/><rect x="335" y="374" width="220" height="98" rx="16"/>
<rect x="610" y="374" width="220" height="98" rx="16"/><rect x="885" y="374" width="220" height="98" rx="16"/>
<rect x="1160" y="374" width="220" height="98" rx="16"/>
</g>
<g stroke="#335e7d" stroke-width="3" marker-end="url(#arrow)"><path d="M280 423H322"/><path d="M555 423H597"/><path d="M830 423H872"/><path d="M1105 423H1147"/></g>
<g font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#142f45">
<text x="170" y="412">Finish the group</text><text x="170" y="442" font-size="16">No live gradients</text>
<text x="445" y="412">Qualify the prefix</text><text x="445" y="442" font-size="16">Health · order · calls</text>
<text x="720" y="412">Persist checkpoint</text><text x="720" y="442" font-size="16">File + directory fsync</text>
<text x="995" y="412">Commit sidecar</text><text x="995" y="442" font-size="16">Exact hash-bound pair</text>
<text x="1270" y="412">Resume exactly</text><text x="1270" y="442" font-size="16">RNG · optimizer · clock</text>
</g>
<path d="M812 489V516H994" stroke="#bc6453" fill="none" stroke-width="2"/>
<text x="1040" y="523" font-family="Arial,sans-serif" font-size="16" fill="#995342">Crash before marker: HOLD; preserve orphan</text>
<rect x="60" y="560" width="648" height="166" rx="18" fill="#e2f2e9"/>
<text x="88" y="599" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#24543e">Measured on synthetic CPU training</text>
<text x="88" y="633" font-family="Arial,sans-serif" font-size="18" fill="#24543e">868 groups · 1,302-group schedule · bitwise state equality</text>
<text x="88" y="665" font-family="Arial,sans-serif" font-size="18" fill="#24543e">Fresh process trains the remaining 768 groups</text>
<text x="88" y="697" font-family="Arial,sans-serif" font-size="18" fill="#24543e">Actual crash subprocesses + 25 targeted controls</text>
<rect x="732" y="560" width="648" height="166" rx="18" fill="#e9edf3"/>
<text x="760" y="599" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#334c62">Native qualification remains separate</text>
<text x="760" y="633" font-family="Arial,sans-serif" font-size="18" fill="#526b7f">MRI reader · workers · CUDA · DataParallel · evaluation</text>
<text x="760" y="665" font-family="Arial,sans-serif" font-size="18" fill="#526b7f">Explicit health allowance · persistence memory and time</text>
<text x="760" y="697" font-family="Arial,sans-serif" font-size="18" fill="#526b7f">No official score or parameter-change claim</text>
<text x="64" y="768" font-family="Arial,sans-serif" font-size="15" fill="#708499">Original MIT diagram · checkpoint bytes are immutable; continuation requires the exact committed predecessor.</text>
</svg>
