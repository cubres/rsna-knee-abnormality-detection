<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">A single mild affine grid shared across a study</title>
<desc id="desc">Invented study UID, epoch and seed select four dedicated PCG64 draws. One inverse grid is reused across twelve image windows and three channels per window, then sampled with bilinear zero padding before normalization. Synthetic CPU measurements distinguish center-outside fraction and missing bilinear mass.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#1d817a"/></marker></defs>
<rect width="1440" height="980" fill="#f4f7f7"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#193546} .caption{fill:#516a77} .small{font-size:19px} .body{font-size:24px} .label{font-size:22px;font-weight:700} .card{fill:#fff;stroke:#d5e2e5;stroke-width:2} .link{fill:none;stroke:#1d817a;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="48" y="64" class="body" style="font-size:44px;font-weight:700">One study. One transform.</text>
<text x="48" y="105" class="caption body" >Deterministic in-plane geometry for raw-image windows</text>
<text x="1392" y="64" class="caption small" text-anchor="end">SYNTHETIC · CPU CHECKS</text>
<rect x="48" y="143" width="408" height="142" rx="18" class="card"/>
<rect x="516" y="143" width="408" height="142" rx="18" class="card"/>
<rect x="984" y="143" width="408" height="142" rx="18" class="card"/>
<text x="70" y="181" class="label" >1   Stable study key</text>
<text x="70" y="221" class="body" >exact UID + epoch + seed</text>
<text x="70" y="255" class="caption small" >SHA256 → owned PCG64</text>
<text x="538" y="181" class="label" >2   Four small draws</text>
<text x="538" y="221" class="body" >±5°   ·   ±2% x/y   ·   .98–1.02</text>
<text x="538" y="255" class="caption small" >Independent of training RNG</text>
<text x="1006" y="181" class="label" >3   One inverse grid</text>
<text x="1006" y="221" class="body" >Same map for every plane</text>
<text x="1006" y="255" class="caption small" >Shared 2D coordinates · no 3D rotation</text>
