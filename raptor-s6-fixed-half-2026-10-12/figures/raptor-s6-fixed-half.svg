<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770" role="img" aria-labelledby="title desc">
 <title id="title">Two knee readers, one fixed percentile blend</title>
 <desc id="desc">Raptor averages original and anatomically mirrored probabilities. S6 averages four fold logits then applies a sigmoid. Exact study and label alignment and complete native receipts are checked before each probability table receives average tie percentile ranks. The final score is their fixed half and half mean. This is a conceptual method diagram, not measured accuracy.</desc>
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102333"/><stop offset="1" stop-color="#183b45"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#afd2d7"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif} .muted{fill:#b7d0d4}.dark{fill:#183641}.small{font-size:17px}.body{font-size:20px}.heading{font-size:25px;font-weight:700}.line{fill:none;stroke:#afd2d7;stroke-width:3;marker-end:url(#arrow)}</style>
 </defs>
 <rect width="1280" height="770" fill="url(#bg)"/>
 <text x="64" y="65" fill="#f4fbfc" font-size="35" font-weight="700">Two views of a knee</text>
 <text x="64" y="102" class="muted body">Complementary readers · explicit provenance · one fixed blend</text>
 <rect x="64" y="145" width="525" height="210" rx="22" fill="#e0f7ed"/>
 <rect x="691" y="145" width="525" height="210" rx="22" fill="#ece9ff"/>
 <circle cx="109" cy="187" r="19" fill="#247e64"/><text x="103" y="194" fill="white" font-size="20" font-weight="700">A</text>
 <text x="146" y="195" class="dark heading">Raptor + anatomical mirror</text>
 <text x="96" y="240" class="dark body">Ordinal slice bank → two orientations</text>
 <text x="96" y="275" class="dark body">Mean of original and mirrored probabilities</text>
 <text x="96" y="320" class="dark small">Use raw probabilities.npz, before submission ranks</text>
 <circle cx="736" cy="187" r="19" fill="#62569a"/><text x="730" y="194" fill="white" font-size="20" font-weight="700">B</text>
 <text x="773" y="195" class="dark heading">S6 + physical joint views</text>
 <text x="723" y="240" class="dark body">Side check → joint anchor → physical windows</text>
 <text x="723" y="275" class="dark body">Four fold mean logits → sigmoid</text>
 <text x="723" y="320" class="dark small">Keep all four exact folds and the original geometry</text>
 <path class="line" d="M326 355V435H380"/><path class="line" d="M954 355V435H900"/>
 <rect x="388" y="383" width="504" height="104" rx="18" fill="#ffffff"/>
 <text x="640" y="420" text-anchor="middle" class="dark heading">Align and qualify</text>
 <text x="640" y="455" text-anchor="middle" class="dark small">Exact studies · label order · hashes · complete native runs</text>
 <path class="line" d="M640 487V523"/>
 <rect x="244" y="524" width="792" height="114" rx="18" fill="#f4fbfc"/>
 <text x="640" y="565" text-anchor="middle" class="dark heading">Rank each reader, then take the direct mean</text>
 <text x="640" y="602" text-anchor="middle" class="dark body">score = 0.5 × percentile(A) + 0.5 × percentile(B)</text>
 <text x="640" y="676" text-anchor="middle" fill="#e6f3f5" class="body">Ties keep their average rank. Every finding uses the same weight.</text>
 <text x="640" y="716" text-anchor="middle" class="muted small">A failed or incomplete reader does not qualify as a two-reader blend.</text>
 <text x="640" y="747" text-anchor="middle" class="muted" font-size="14">Original conceptual diagram · no accuracy, calibration or score gain is claimed</text>
</svg>
