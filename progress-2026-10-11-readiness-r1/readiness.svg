<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">RSNA Knee: result and readiness</title><desc id="desc">Dated evidence, with each proof kept at the level it establishes. Next gate: missing-aware training and GPU model checks before a scored claim.
Conceptual diagram only; no study data, prediction plot or clinical conclusion.</desc>
<rect width="1200" height="520" rx="24" fill="#f7f8fc"/>
<text x="44" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#17243b">RSNA Knee: result and readiness</text>
<text x="44" y="91" font-family="sans-serif" font-size="18" fill="#43546d">Dated evidence, with each proof kept at the level it establishes.</text>
<rect x="44" y="130" width="352" height="270" rx="18" fill="#e3f4e9" stroke="#c9d3e0"/>
<text x="66" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">Official result</text>
<text x="66" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">Version 11: COMPLETE</text>
<text x="66" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Public score: 0.949</text>
<text x="66" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Ties the prior 0.949 result</text>
<text x="66" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">Target 0.956: unachieved</text>
<line x1="66" x2="374" y1="332" y2="332" stroke="#9aacc5"/>
<text x="66" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">A tie is no measured gain.</text>
<text x="66" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">Only the completed row is scored.</text>
<rect x="416" y="130" width="352" height="270" rx="18" fill="#e6eefc" stroke="#c9d3e0"/>
<text x="438" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">Native experiment</text>
<text x="438" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">K24 Version 12 completed</text>
<text x="438" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Unsubmitted native check</text>
<text x="438" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Sample output unchanged</text>
<text x="438" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">No new official score</text>
<line x1="438" x2="746" y1="332" y2="332" stroke="#9aacc5"/>
<text x="438" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">Native execution can pass</text>
<text x="438" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">without proving improvement.</text>
<rect x="788" y="130" width="352" height="270" rx="18" fill="#f5e9fb" stroke="#c9d3e0"/>
<text x="810" y="172" font-family="sans-serif" font-size="23" font-weight="700" fill="#17243b">CPU readiness</text>
<text x="810" y="209" font-family="sans-serif" font-size="18" fill="#263e5a">S6: 87 CPU checks passed</text>
<text x="810" y="238" font-family="sans-serif" font-size="18" fill="#263e5a">Asset and source checks</text>
<text x="810" y="267" font-family="sans-serif" font-size="18" fill="#263e5a">Reader diagnostic completed</text>
<text x="810" y="296" font-family="sans-serif" font-size="18" fill="#263e5a">Training repair still pending</text>
<line x1="810" x2="1118" y1="332" y2="332" stroke="#9aacc5"/>
<text x="810" y="363" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">GPU/model accuracy remains</text>
<text x="810" y="387" font-family="sans-serif" font-size="16" font-weight="700" fill="#263e5a">unqualified by CPU checks.</text>
<text x="44" y="449" font-family="sans-serif" font-size="18" fill="#43546d">Next gate: missing-aware training and GPU model checks before a scored claim.</text>
<text x="44" y="476" font-family="sans-serif" font-size="18" fill="#43546d">Conceptual diagram only; no study data, prediction plot or clinical conclusion.</text>
</svg>
